<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #007bff;
            user-select: none;
        }

        .remember-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .remember-group input {
            width: auto;
            margin-right: 8px;
        }

        .btn-login {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
        }

        .footer-links a {
            color: #007bff;
            text-decoration: none;
        }

        .footer-links span {
            color: #777;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" id="emailInp" placeholder="Enter your email address">
        </div>

        <div class="form-group">
            <label>Password:</label>
            <div class="password-wrapper">
                <input type="password" id="passInp" placeholder="Enter your password">
                <span class="toggle-password" onclick="togglePassword()">Xem</span>
            </div>
        </div>

        <div class="remember-group">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe" style="display:inline; margin:0;">Ghi nhớ tài khoản trong 24 giờ</label>
        </div>

        <button class="btn-login" onclick="handleLogin()">Login</button>

        <div class="footer-links">
            <a href="#">Forgot password?</a>
            <span>or</span>
            <a href="#">SignUp</a>
        </div>
    </div>

    <script>
        let mockUser = {
            email: "admin@gmail.com",
            password: "123"
        };

        function togglePassword() {
            let passInp = document.getElementById("passInp");
            let toggleBtn = document.querySelector(".toggle-password");
            if (passInp.type === "password") {
                passInp.type = "text";
                toggleBtn.textContent = "Ẩn";
            } else {
                passInp.type = "password";
                toggleBtn.textContent = "Xem";
            }
        }

        function handleLogin() {
            let email = document.getElementById("emailInp").value.trim();
            let password = document.getElementById("passInp").value;
            let rememberMe = document.getElementById("rememberMe").checked;

            if (email === "") {
                alert("Email không được bỏ trống!");
                return;
            }

            if (email === mockUser.email && password === mockUser.password) {
                if (rememberMe) {
                    let now = new Date();
                    let expiryTime = now.getTime() + (24 * 60 * 60 * 1000);
                    localStorage.setItem("loginExpiry", expiryTime);
                    localStorage.setItem("savedEmail", email);
                }
                
                alert("Đăng nhập thành công! Đang chuyển hướng về trang chủ...");
                window.location.href = "index.html"; 
            } else {
                alert("Email hoặc Password không trùng khớp!");
            }
        }

        window.onload = function() {
            let expiry = localStorage.getItem("loginExpiry");
            let now = new Date().getTime();
            if (expiry && now < parseInt(expiry)) {
                let savedEmail = localStorage.getItem("savedEmail");
                if (savedEmail) {
                    document.getElementById("emailInp").value = savedEmail;
                    document.getElementById("rememberMe").checked = true;
                }
            } else {
                localStorage.removeItem("loginExpiry");
                localStorage.removeItem("savedEmail");
            }
        };
    </script>

</body>
</html>
