<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Register Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background-color: white;
            padding: 40px;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-register {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-register:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Register</h2>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" id="emailInp" placeholder="Enter your email address">
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="passInp" placeholder="Enter your password">
        </div>

        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" id="confirmPassInp" placeholder="Enter your confirm password">
        </div>

        <button class="btn-register" onclick="handleRegister()">Register</button>
    </div>

    <script>
        let usersDatabase = [
            { email: "test@gmail.com", password: "123" }
        ];

        function handleRegister() {
            let email = document.getElementById("emailInp").value.trim();
            let password = document.getElementById("passInp").value;
            let confirmPassword = document.getElementById("confirmPassInp").value;

            if (email === "" || password === "" || confirmPassword === "") {
                alert("Vui lòng nhập đầy đủ tất cả các thông tin!");
                return;
            }

            if (password !== confirmPassword) {
                alert("Mật khẩu xác nhận không trùng khớp!");
                return;
            }

            let emailExists = false;
            for (let i = 0; i < usersDatabase.length; i++) {
                if (usersDatabase[i].email === email) {
                    emailExists = true;
                    break;
                }
            }

            if (emailExists === true) {
                alert("Email này đã tồn tại trên hệ thống!");
                return;
            }

            usersDatabase.push({ email: email, password: password });
            alert("Đăng ký tài khoản thành công!");
            
            document.getElementById("emailInp").value = "";
            document.getElementById("passInp").value = "";
            document.getElementById("confirmPassInp").value = "";
            
            console.log("Danh sách tài khoản hiện tại:", usersDatabase);
        }
    </script>

</body>
</html>
